<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice">
  <!-- Default wallpaper: layered mountains at dusk. Mid-tone on purpose, so
       glass themes have something to blur and stay readable. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2445"/>
      <stop offset=".45" stop-color="#4a3f73"/>
      <stop offset=".75" stop-color="#c46f7d"/>
      <stop offset="1" stop-color="#f2b08a"/>
    </linearGradient>
    <radialGradient id="sun" cx="1650" cy="900" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2b0" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#ffc58f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5f8f"/>
      <stop offset="1" stop-color="#6b4f80"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4475"/>
      <stop offset="1" stop-color="#3d3460"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33294f"/>
      <stop offset="1" stop-color="#231d3b"/>
    </linearGradient>
    <linearGradient id="m4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1630"/>
      <stop offset="1" stop-color="#110e20"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b08a" stop-opacity="0"/>
      <stop offset="1" stop-color="#f2b08a" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <circle cx="1650" cy="900" r="520" fill="url(#sun)"/>
  <circle cx="1650" cy="900" r="70" fill="#ffe9c4" opacity=".9"/>

  <g fill="#fff" opacity=".7">
    <circle cx="210" cy="120" r="1.6"/><circle cx="480" cy="210" r="1.2"/><circle cx="760" cy="90" r="1.8"/>
    <circle cx="1020" cy="170" r="1.1"/><circle cx="1330" cy="70" r="1.5"/><circle cx="1880" cy="140" r="1.3"/>
    <circle cx="2140" cy="60" r="1.7"/><circle cx="2400" cy="190" r="1.2"/><circle cx="620" cy="320" r="1"/>
    <circle cx="1540" cy="250" r="1.1"/><circle cx="2260" cy="300" r="1"/><circle cx="90" cy="330" r="1.2"/>
  </g>

  <path fill="url(#m1)" d="M0 900 L180 820 L360 870 L560 760 L760 850 L980 740 L1180 830 L1400 720 L1620 820 L1840 730 L2060 810 L2300 720 L2560 800 L2560 1440 L0 1440 Z"/>
  <rect y="760" width="2560" height="260" fill="url(#haze)"/>
  <path fill="url(#m2)" d="M0 1010 L220 900 L420 980 L640 860 L860 970 L1080 880 L1300 990 L1520 870 L1760 980 L1980 890 L2220 990 L2400 910 L2560 960 L2560 1440 L0 1440 Z"/>
  <path fill="url(#m3)" d="M0 1130 L260 1020 L520 1110 L780 990 L1040 1100 L1300 1010 L1560 1120 L1820 1020 L2080 1110 L2320 1030 L2560 1090 L2560 1440 L0 1440 Z"/>
  <path fill="url(#m4)" d="M0 1260 L300 1170 L620 1250 L940 1150 L1260 1240 L1580 1160 L1900 1250 L2220 1170 L2560 1230 L2560 1440 L0 1440 Z"/>
</svg>
